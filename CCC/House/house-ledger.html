<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- No maximum-scale / user-scalable=no: blocking pinch zoom is an
     accessibility failure, newer iOS Safari ignores it anyway, and the
     layout is responsive enough not to need it. -->
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>House Ledger</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">


<style>
/* ─── CSS-HEADER ─── */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#e8f0f4;--card:#fff;--border:#d0dbe4;--t1:#1a2a3a;--t2:#4a5a6a;--t3:#8a9aaa;--accent:#0d7377;--accentDk:#095456;--accentLt:#e0f4f4;--accent2:#e94560;--accent2Dk:#b8354d;--accent2Lt:#fce8ec;--rose:#e94560;--roseLt:#fce8ec;--lav:#7c3aed;--lavLt:#ede9fe;--amber:#d97706;--amberLt:#fef3c7;--sky:#0284c7;--skyLt:#e0f2fe;--headerGrad:linear-gradient(135deg,#0d7377 0%,#14919b 100%);--tabActive:#0d7377;--scrollThumb:#0d7377}
html{font-size:16px}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;overflow-x:hidden;padding-bottom:80px}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--scrollThumb);border-radius:3px}
h1,h2,h3,.serif{font-family:'Playfair Display',serif}
.header{background:var(--headerGrad);color:#fff;padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.header h1{font-size:1.2rem;letter-spacing:.5px}
.header-r{display:flex;gap:8px;align-items:center}
.header-btn{background:rgba(255,255,255,.18);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sync-dot{width:8px;height:8px;border-radius:50%;margin-right:6px}
.sync-live{background:#4ade80;animation:pulse 2s infinite}
.sync-err{background:#ef4444}
.sync-loading{background:#fbbf24;animation:pulse .9s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ─── CSS-HERO-CARDS ─── */
.hero-row{display:flex;gap:12px;padding:12px 12px 4px;overflow-x:auto;scroll-snap-type:x mandatory}
/* While a card is expanded the row stops being a horizontal scroller and
   wraps instead: the expanded card takes a full-width line and its siblings
   stay visible below it, rather than being shoved off-screen. */
.hero-row.stacked{overflow-x:visible;flex-wrap:wrap;scroll-snap-type:none}
.hero-card{flex:0 0 calc(50% - 6px);scroll-snap-align:start;background:var(--card);border-radius:20px;border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:all .3s ease;min-width:0}
.hero-card.expanded{flex:0 0 100%;position:relative}
.hero-front{padding:16px 14px}
.hero-label{font-size:.7rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--t3);font-weight:700;margin-bottom:6px}
.hero-big{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:800;line-height:1.15;color:var(--t1);word-break:break-word;overflow-wrap:anywhere}
.hero-sub{font-size:.72rem;color:var(--t2);margin-top:4px;font-weight:600}
.hero-expand{max-height:0;overflow:hidden;transition:max-height .35s ease,padding .35s ease;padding:0 14px}
.hero-card.expanded .hero-expand{max-height:500px;padding:0 14px 16px}
.hero-chevron{text-align:center;font-size:.7rem;color:var(--t3);padding:2px 0 6px;transition:transform .3s}
.hero-card.expanded .hero-chevron{transform:rotate(180deg)}
.split-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:8px 0 4px;gap:2px}
.split-seg{border-radius:3px;transition:flex .3s}
.budget-bar-wrap{margin:8px 0}
.budget-bar{height:8px;border-radius:4px;background:var(--border);overflow:hidden;position:relative}
.budget-fill{height:100%;border-radius:4px;transition:width .5s}
.budget-labels{display:flex;justify-content:space-between;font-size:.7rem;color:var(--t3);margin-top:3px;font-weight:600}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:.78rem}
.detail-row .label{color:var(--t2)}
.detail-row .value{font-weight:700;color:var(--t1)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;flex-shrink:0}

/* ─── CSS-TAB-BAR ─── */
.tab-bar{display:flex;background:var(--card);border-top:1px solid var(--border);position:fixed;bottom:0;left:0;right:0;z-index:40;padding:4px 0 env(safe-area-inset-bottom,4px)}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.7rem;font-weight:700;color:var(--t3);cursor:pointer;border:none;background:none;transition:color .2s}
.tab-item.active{color:var(--tabActive)}
.tab-icon{font-size:1.15rem}

/* ─── CSS-ENTRY-LIST ─── */
.entry-list{padding:8px 12px}
.search-bar{display:flex;gap:8px;margin-bottom:8px}
.search-bar input{flex:1;padding:10px 14px;border-radius:14px;border:1px solid var(--border);background:var(--card);font-size:.85rem;color:var(--t1);font-family:'Nunito',sans-serif}
.filter-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;background:var(--accentLt);color:var(--accent);font-size:.7rem;font-weight:700;margin-bottom:8px;cursor:pointer}
.list-tools{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.sort-seg{display:flex;flex:1;gap:0;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--card)}
.sort-seg button{flex:1;padding:7px 6px;border:none;background:none;font-family:'Nunito',sans-serif;font-size:.72rem;font-weight:700;color:var(--t2);cursor:pointer;white-space:nowrap}
.sort-seg button+button{border-left:1px solid var(--border)}
.sort-seg button.active{background:var(--accent);color:#fff}
.export-btn{flex-shrink:0;padding:7px 12px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--t2);font-family:'Nunito',sans-serif;font-size:.72rem;font-weight:700;cursor:pointer;white-space:nowrap}
.export-btn:active{background:var(--accentLt);color:var(--accent)}
.status-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.status-chip{padding:4px 10px;border-radius:20px;border:1px solid transparent;font-size:.7rem;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif}
.status-chip.on{box-shadow:0 0 0 2px var(--accent) inset}
.subtotal-bar{background:var(--accentLt);border-radius:14px;padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.subtotal-bar .crumb{font-size:.72rem;color:var(--accent);font-weight:600}
.subtotal-bar .amt{font-family:'Playfair Display',serif;font-weight:700;color:var(--accent);font-size:1rem}
.entry-row{background:var(--card);border-radius:16px;border:1px solid var(--border);margin-bottom:8px;overflow:hidden;position:relative;touch-action:pan-y}
.entry-content{padding:12px 14px;position:relative;z-index:2;background:var(--card);transition:transform .15s}
.entry-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.entry-vendor{font-weight:700;font-size:.88rem;color:var(--t1);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry-amt{font-family:'Playfair Display',serif;font-weight:700;font-size:1rem;color:var(--t1);white-space:nowrap;flex-shrink:0}
.entry-meta{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;align-items:center}
.entry-date{font-size:.7rem;color:var(--t3)}
.chip{display:inline-flex;padding:3px 8px;border-radius:10px;font-size:.7rem;font-weight:700;white-space:nowrap}
.entry-detail{padding:0 14px;max-height:0;overflow:hidden;transition:max-height .3s}
.entry-detail.open{max-height:400px;padding:8px 14px 14px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.detail-cell{font-size:.72rem}
.detail-cell .lbl{color:var(--t3);font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.detail-cell .val{color:var(--t1);font-weight:600;margin-top:1px}
.swipe-hint{text-align:center;font-size:.7rem;color:var(--t3);padding:4px 0 8px;font-style:italic}
/* Opacity tracks swipe distance and the label changes at the commit
   threshold, so 60px is felt rather than guessed. */
.swipe-underlay{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding:0 18px;font-weight:700;font-size:.8rem;color:#fff;z-index:1;opacity:0}
.swipe-underlay.left{right:0;background:#ef4444;border-radius:0 16px 16px 0}
.swipe-underlay.right{left:0;background:#3b82f6;border-radius:16px 0 0 16px}
.swipe-tip{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1px dashed var(--border);border-radius:12px;padding:7px 12px;margin-bottom:8px;font-size:.7rem;color:var(--t2);font-weight:600}
.swipe-tip button{background:none;border:none;color:var(--t3);font-size:.85rem;font-weight:700;cursor:pointer;padding:0 2px;line-height:1}

/* ─── CSS-OVERVIEW-CARDS ─── */
.overview-card{background:var(--card);border-radius:18px;border:1px solid var(--border);padding:16px;margin-bottom:10px;cursor:pointer;transition:transform .15s}
.overview-card:active{transform:scale(.98)}
.ov-header{display:flex;justify-content:space-between;align-items:flex-start}
.ov-title{font-family:'Playfair Display',serif;font-weight:700;font-size:1.05rem;color:var(--t1)}
.ov-amount{font-family:'Playfair Display',serif;font-weight:700;font-size:1.1rem;color:var(--t1);white-space:nowrap}
.ov-meta{font-size:.7rem;color:var(--t3);margin-top:4px;font-weight:600}
.ov-mini-bar{display:flex;height:4px;border-radius:2px;overflow:hidden;margin-top:8px;gap:1px}
.ov-mini-seg{border-radius:2px}
.back-btn{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:12px;background:var(--accentLt);color:var(--accent);font-size:.75rem;font-weight:700;border:none;cursor:pointer;margin-bottom:10px}
.alloc-card{background:var(--card);border-radius:18px;border:1px solid var(--border);padding:14px;margin-bottom:10px}
.alloc-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.alloc-head .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--t3);font-weight:700}
.alloc-head .amt{font-family:'Playfair Display',serif;font-weight:700;font-size:1.05rem;color:var(--t1)}
.alloc-btn{width:100%;margin-top:10px;padding:9px;border-radius:12px;border:1px solid var(--accent);background:var(--accentLt);color:var(--accent);font-family:'Nunito',sans-serif;font-size:.75rem;font-weight:700;cursor:pointer}
.bud-none{font-size:.7rem;color:var(--t3);font-weight:600;margin-top:8px;font-style:italic}
.bud-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.bud-row:last-of-type{border-bottom:none}
.bud-row .bp{flex:1;min-width:0}
.bud-row .bp .n{font-size:.78rem;font-weight:700;color:var(--t1);display:flex;align-items:center;gap:5px}
.bud-row .bp .s{font-size:.7rem;color:var(--t3);font-weight:600;margin-top:1px}
.bud-row input{width:104px;flex-shrink:0;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);font-size:.8rem;color:var(--t1);font-family:'Nunito',sans-serif;text-align:right}
.bud-total{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0 2px;font-size:.78rem;font-weight:700;color:var(--t2);border-top:2px solid var(--border);margin-top:6px}

/* ─── CSS-VENDOR-TAB ─── */
.vendor-card{background:var(--card);border-radius:18px;border:1px solid var(--border);padding:16px;margin-bottom:10px;cursor:pointer;transition:transform .15s}
.vendor-card:active{transform:scale(.98)}
.v-header{display:flex;justify-content:space-between;align-items:flex-start}
.v-name{font-weight:700;font-size:.92rem;color:var(--t1);flex:1;min-width:0}
.v-total{font-family:'Playfair Display',serif;font-weight:700;font-size:1.05rem;color:var(--t1);white-space:nowrap;flex-shrink:0}
.v-meta{font-size:.7rem;color:var(--t3);margin-top:4px;font-weight:600}
.v-intermediary{font-size:.7rem;color:var(--lav);margin-top:4px;font-weight:600}
.v-modes{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}

/* ─── CSS-TIMELINE ─── */
.tl-chart{padding:12px 6px;background:var(--card);border-radius:18px;border:1px solid var(--border);margin-bottom:10px}
/* Horizontally scrollable with fixed-width bars and upright labels. At
   flex:1 across ~20 months the bars were ~15px wide and the labels were 8px
   of text rotated -45°, which is unreadable on a phone. */
.tl-bars{display:flex;align-items:flex-end;gap:6px;padding:0 6px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.tl-bar-col{flex:0 0 38px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border-radius:6px;padding:2px 0;background:none;border:none;font-family:'Nunito',sans-serif}
.tl-bar-col.sel{background:var(--accentLt)}
.tl-stack{display:flex;flex-direction:column;width:100%;border-radius:4px 4px 0 0;overflow:hidden}
.tl-bar{width:100%;transition:opacity .2s;min-height:2px}
.tl-bar-col:active .tl-stack{opacity:.7}
.tl-month{font-size:.7rem;color:var(--t3);font-weight:700;white-space:nowrap;margin-top:4px}
.tl-bar-col.sel .tl-month{color:var(--accent)}
.tl-axis{display:flex;justify-content:space-between;align-items:baseline;padding:0 8px 6px;font-size:.7rem;color:var(--t3);font-weight:700}
.tl-readout{background:var(--accentLt);border-radius:14px;padding:10px 14px;margin-bottom:10px}
.tl-readout .r-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tl-readout .r-month{font-size:.8rem;font-weight:700;color:var(--accent)}
.tl-readout .r-amt{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;color:var(--accent)}
.tl-readout .r-sub{font-size:.7rem;color:var(--t2);font-weight:600;margin-top:2px}
.tl-readout button{width:100%;margin-top:8px;padding:8px;border-radius:12px;border:1px solid var(--accent);background:var(--card);color:var(--accent);font-family:'Nunito',sans-serif;font-size:.75rem;font-weight:700;cursor:pointer}
.tl-toggle{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.tl-toggle button{padding:6px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);font-size:.72rem;font-weight:700;color:var(--t2);cursor:pointer;font-family:'Nunito',sans-serif}
.tl-toggle button.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ─── CSS-FAB ─── */
.fab{position:fixed;bottom:70px;right:16px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:1.6rem;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:35;display:flex;align-items:center;justify-content:center}

/* ─── CSS-MODAL-FORM ─── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);border-radius:24px 24px 0 0;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;padding:20px 16px env(safe-area-inset-bottom,16px)}
.modal h2{font-size:1.1rem;margin-bottom:14px;color:var(--t1)}
.form-steps{display:flex;gap:6px;margin-bottom:16px}
.form-step{flex:1;height:4px;border-radius:2px;background:var(--border)}
.form-step.active{background:var(--accent)}
.form-step.done{background:var(--accent);opacity:.5}
.field{margin-bottom:12px}
.field label{display:block;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--bg);font-size:.88rem;color:var(--t1);font-family:'Nunito',sans-serif}
.field textarea{resize:vertical;min-height:60px}
.toggle-group{display:flex;gap:6px}
.toggle-btn{flex:1;padding:8px;border-radius:12px;border:1px solid var(--border);background:var(--card);font-size:.78rem;font-weight:600;cursor:pointer;text-align:center;color:var(--t2);font-family:'Nunito',sans-serif;transition:all .2s}
.toggle-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.form-actions{display:flex;gap:8px;margin-top:16px}
.form-actions button{flex:1;padding:12px;border-radius:14px;border:none;font-size:.9rem;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--border);color:var(--t2)}
.btn-danger{background:#ef4444;color:#fff}
.amt-echo{font-family:'Playfair Display',serif;font-size:.85rem;font-weight:700;color:var(--accent);margin-top:5px}
.autofill-note{display:flex;align-items:center;gap:6px;justify-content:space-between;background:var(--amberLt);color:var(--amber);border-radius:10px;padding:6px 10px;font-size:.7rem;font-weight:700;margin-top:6px}
.autofill-note button{background:none;border:none;color:inherit;font-size:.8rem;font-weight:700;cursor:pointer;padding:0 2px;line-height:1}
.field-err{font-size:.7rem;font-weight:700;color:var(--rose);margin-top:4px}
.form-hint{font-size:.72rem;color:var(--t3);font-weight:600;margin-top:12px;text-align:center}

/* ─── CSS-CONFIRM-THEME ─── */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px}
.confirm-box{background:var(--card);border-radius:20px;padding:24px;max-width:320px;width:100%;text-align:center}
.confirm-box h3{margin-bottom:8px;font-size:1rem}
.confirm-box p{font-size:.85rem;color:var(--t2);margin-bottom:16px}
.theme-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:flex;align-items:center;justify-content:center}
.theme-picker{background:var(--card);border-radius:24px;padding:24px;max-width:300px;width:90%}
.theme-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}
.theme-opt{padding:14px 8px;border-radius:14px;border:2px solid var(--border);text-align:center;cursor:pointer;font-size:.75rem;font-weight:700;transition:all .2s}
.theme-opt.active{border-color:var(--accent);background:var(--accentLt)}
.theme-emoji{font-size:1.4rem;display:block;margin-bottom:4px}
.user-menu{position:absolute;top:100%;right:8px;background:var(--card);border-radius:14px;border:1px solid var(--border);padding:6px;min-width:140px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:55}
.user-opt{padding:8px 12px;border-radius:10px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--t1)}
.user-opt:hover,.user-opt.active{background:var(--accentLt);color:var(--accent)}
.user-who{padding:8px 12px;font-size:.8rem;font-weight:700;color:var(--t1);border-bottom:1px solid var(--border);margin-bottom:4px}
.user-who span{display:block;font-size:.7rem;font-weight:600;color:var(--t3);margin-top:2px;word-break:break-all}
.readonly-note{display:flex;align-items:center;gap:6px;justify-content:center;background:var(--card);border:1px dashed var(--border);border-radius:12px;padding:7px 12px;margin-bottom:8px;font-size:.7rem;color:var(--t2);font-weight:600}
.readonly-note button{background:none;border:none;color:var(--accent);font-size:.7rem;font-weight:700;cursor:pointer;text-decoration:underline;font-family:'Nunito',sans-serif}

/* ─── CSS-MISC ─── */
.empty-state{text-align:center;padding:40px 20px;color:var(--t3)}
.empty-state .icon{font-size:2.5rem;margin-bottom:8px}
.empty-state p{font-size:.85rem}
.skel-row{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.skel-line{height:11px;border-radius:6px;background:var(--border);opacity:.6;animation:shimmer 1.2s ease-in-out infinite}
.skel-line+.skel-line{margin-top:8px}
@keyframes shimmer{0%,100%{opacity:.6}50%{opacity:.25}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>const {
  useState,
  useEffect,
  useRef,
  useCallback,
  useMemo
} = React;

// ─── JS-FIREBASE ───
const PROJ = 'japan-2026-apr',
  AKEY = 'AIzaSyD372bOo6NQR6VxB-_kkv4zfLNt4B5HaAc';
const FS_EXP = `https://firestore.googleapis.com/v1/projects/${PROJ}/databases/(default)/documents/house-expenses`;
const FS_BUD = `https://firestore.googleapis.com/v1/projects/${PROJ}/databases/(default)/documents/house-budgets`;
const ID_SIGNIN = `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${AKEY}`;

// ─── JS-AUTH ───
// Email/password against the Identity Toolkit REST API — no Firebase SDK, in
// keeping with the rest of the app. Reads stay public and need no token; the
// token is required only for writes, which is what the Firestore rules
// enforce (see DEVELOPMENT.md).
const AUTH_KEY = 'hl-auth';
let authState = null;
const authListeners = new Set();
function loadAuth() {
  try {
    const raw = localStorage.getItem(AUTH_KEY);
    authState = raw ? JSON.parse(raw) : null;
  } catch (e) {
    authState = null;
  }
  return authState;
}
function setAuth(a) {
  authState = a;
  if (a) localStorage.setItem(AUTH_KEY, JSON.stringify(a));else localStorage.removeItem(AUTH_KEY);
  authListeners.forEach(fn => fn(a));
}
function nameFromEmail(e) {
  const l = (e || '').split('@')[0].replace(/[._-]+/g, ' ').trim();
  return l ? l.charAt(0).toUpperCase() + l.slice(1) : 'Unknown';
}
const authErr = m => ({
  EMAIL_NOT_FOUND: 'No account with that email',
  INVALID_PASSWORD: 'Wrong password',
  INVALID_LOGIN_CREDENTIALS: 'Wrong email or password',
  USER_DISABLED: 'That account is disabled',
  TOO_MANY_ATTEMPTS_TRY_LATER: 'Too many attempts — try again later'
})[m] || 'Sign-in failed';
async function signIn(email, password) {
  const r = await fetch(ID_SIGNIN, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      email: email.trim(),
      password,
      returnSecureToken: true
    })
  });
  const d = await r.json();
  if (!r.ok) throw new Error(authErr(d.error?.message?.split(' ')[0]));
  // Expire a minute early so a write never races the token.
  setAuth({
    idToken: d.idToken,
    refreshToken: d.refreshToken,
    expiresAt: Date.now() + (+d.expiresIn - 60) * 1000,
    email: d.email,
    name: d.displayName || nameFromEmail(d.email)
  });
  return authState;
}
function signOut() {
  setAuth(null);
}
async function refreshAuth() {
  if (!authState?.refreshToken) return null;
  const r = await fetch(ID_REFRESH, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/x-www-form-urlencoded'
    },
    body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(authState.refreshToken)}`
  });
  const d = await r.json();
  if (!r.ok) {
    setAuth(null);
    return null;
  }
  setAuth({
    ...authState,
    idToken: d.id_token,
    refreshToken: d.refresh_token,
    expiresAt: Date.now() + (+d.expires_in - 60) * 1000
  });
  return authState.idToken;
}
async function authToken() {
  if (!authState) return null;
  return Date.now() < authState.expiresAt ? authState.idToken : refreshAuth();
}

  };

async function fetchAll(url, map = fromFS) {
  let all = [],
    token = '';
  do {
    const u = `${url}?key=${AKEY}&pageSize=500${token ? '&pageToken=' + token : ''}`;
    const r = await fetch(u);
    if (!r.ok) throw new Error(r.statusText);
    const d = await r.json();
    if (d.documents) all.push(...d.documents.map(map));
    token = d.nextPageToken || '';
  } while (token);
  return all;
}

// Every write carries the signed-in user's ID token. Reads deliberately do
// not — the rules allow public reads, so the app works signed out.
async function authedFetch(url, opts = {}) {
  const t = await authToken();
  if (!t) throw new Error('Sign in to save changes');
  const go = tok => fetch(url, {
    ...opts,
    headers: {
      ...(opts.headers || {}),
      Authorization: 'Bearer ' + tok
    }
  });
  let r = await go(t);
  if (r.status === 401 || r.status === 403) {
    // Token may have gone stale mid-session; refresh once and retry.
    const t2 = await refreshAuth();
    r = t2 ? await go(t2) : r;
  }
  if (!r.ok) {
    if (r.status === 401 || r.status === 403) throw new Error('Not permitted — sign in again');
    throw new Error(await r.text());
  }
  return r;
}
async function createEntry(e) {
  const id = 'exp-' + Date.now();

async function updateEntry(id, e) {
  const fields = Object.keys(toFS(e).fields);
  const masks = fields.map(f => 'updateMask.fieldPaths=' + f).join('&');
  await authedFetch(`${FS_EXP}/${id}?key=${AKEY}&${masks}`, {
    method: 'PATCH',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(toFS(e))
  });
}

  await authedFetch(`${FS_EXP}/${id}?key=${AKEY}`, {
    method: 'DELETE'
  });
}

// ─── JS-FORMATTING ───
function fmtAmt(n, opts = {}) {
  const abs = Math.abs(n);
  const sign = n < 0 ? '-' : '';
  if (opts.full) return sign + '₹' + abs.toLocaleString('en-IN');
  if (abs >= 10000000) return sign + '₹' + (abs / 10000000).toFixed(2).replace(/\.?0+$/, '') + 'Cr';
  if (abs >= 100000) return sign + '₹' + (abs / 100000).toFixed(2).replace(/\.?0+$/, '') + 'L';
  if (abs >= 1000) return sign + '₹' + (abs / 1000).toFixed(1).replace(/\.?0+$/, '') + 'K';
  return sign + '₹' + abs.toLocaleString('en-IN');
}
function fmtFull(n) {
  return '₹' + Math.abs(n).toLocaleString('en-IN');
}
function fmtDate(d) {
  if (!d) return '';
  const [y, m, dd] = d.split('-');
  const mn = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  return `${parseInt(dd)} ${mn[parseInt(m) - 1]} ${y}`;
}
function fmtDateShort(d) {
  if (!d) return '';
  const [y, m, dd] = d.split('-');
  const mn = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  return `${parseInt(dd)} ${mn[parseInt(m) - 1]} '${y.slice(2)}`;
}
function monthKey(d) {
  return d.slice(0, 7);
}
function thisMonthKey() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}`;
}
function prevMonthKey(k) {
  const [y, m] = k.split('-').map(Number);
  const d = new Date(y, m - 2, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}
function monthEnd(k) {
  const [y, m] = k.split('-').map(Number);
  return `${k}-${String(new Date(y, m, 0).getDate()).padStart(2, '0')}`;
}
